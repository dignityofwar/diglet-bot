---
name: Release

on:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.release.outputs.version }}
        description: 'Version of the release'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.newTag }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          # Full history + tags: the changelog rollup diffs this release's tag against the previous one.
          fetch-depth: 0

      # Needed as when a badge is updated, checkout for some reason won't pull it in
      - name: Ensure the very latest commit has been pulled
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Bump package version
        id: version
        uses: phips28/gh-action-bump-version@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          target-branch: main

      # GitHub's own generated notes only list merged pull requests, so anything pushed straight to
      # main left the release body as nothing but a compare link. This rolls up every conventional
      # commit since the last tag - PR or direct push - and the generated notes get appended below it.
      - name: Build changelog rollup
        run: |
          git fetch --tags --force origin
          ./scripts/build-release-notes.sh "${{ steps.version.outputs.newTag }}" > release-notes.md
          cat release-notes.md

      - name: Create new GitHub Release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ steps.version.outputs.newTag }}
          bodyFile: release-notes.md
          generateReleaseNotes: true
          makeLatest: true
