name: Production Deployment

on:
  push:
    branches: [main]
    # Ensures only actual code changes trigger the workflow, otherwise we don't want to create a full on build.
    paths:
      - '.github/workflows/**'     # GitHub Actions workflows
      - 'src/**'                   # Source code directory
      - 'package.json'             # Node.js dependencies and scripts
      - 'pnpm-lock.yaml'           # Lock file for Node.js dependencies
      - 'eslint.config.*'          # ESLint configuration
      - 'Dockerfile'               # Dockerfile
      - 'docker-compose.yml'       # Docker Compose file
      - 'entrypoint.sh'            # Entrypoint script for Docker container
      - 'jest.config.js'           # Jest configuration
      - 'mikro-orm.config.ts'      # MikroORM configuration
      - 'sonar-project.properties' # SonarQube configuration'

  # Run the full production pipeline by hand from the Actions tab. The paths filter above
  # means a commit touching nothing it lists — an empty commit, a README tweak — will not
  # deploy, so without this there is no way to re-run a deployment without an artificial
  # code change. Useful for verifying the deploy webhook end to end, and for re-deploying
  # after fixing something on the receiving side rather than in this repo.
  workflow_dispatch:

# The release job needs contents: write to push the version bump and tag. A called
# workflow cannot be granted more than its caller holds, so it has to be granted
# here as well as inside release.yml.
permissions:
  contents: read

jobs:
  build:
    name: Build & Test application
    uses: ./.github/workflows/build-and-test-main.yml
    secrets: inherit

  release:
    name: Create Release
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets: inherit

  publish:
    name: Build & Publish container
    needs: [build, release]
    with:
      version: ${{ needs.release.outputs.version }}
    uses: ./.github/workflows/docker-build-push.yml
    secrets: inherit

  trigger-deploy:
    name: Trigger deployment
    needs: publish
    uses: ./.github/workflows/deploy.yml
    secrets: inherit